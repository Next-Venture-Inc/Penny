[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "penny-learn"
version = "0.1.0"
description = "Investment education for everyone. Plain English. Free."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["investing", "education", "finance", "cli", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Education",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "typer>=0.12,<0.13",
  "textual>=0.61,<0.62",
  "rich>=13.7,<14",
  "anthropic>=0.28,<0.29",
  "yfinance>=0.2,<0.3",
  "pandas>=2.2,<2.3",
  "pydantic>=2.7,<2.8",
  "pyyaml>=6.0,<6.1",
  "httpx>=0.27,<0.28",
]

[project.scripts]
penny = "penny.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<8.3",
  "ruff>=0.4,<0.5",
  "pytest-asyncio>=0.23,<0.24",
]

[project.urls]
Homepage = "https://github.com/Next-Venture-Inc/Penny"
Repository = "https://github.com/Next-Venture-Inc/Penny"
Issues = "https://github.com/Next-Venture-Inc/Penny/issues"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["penny"]
